<text x="414" y="368" fill="#9a9a9a" font-size="11">(not part of this pack)</text>

<g id="recombine">
  <rect x="740" y="170" width="230" height="110" rx="10" fill="#2a2a2a" stroke="#4c4c4c" stroke-width="1.5"/>
  <path d="M 740 198 Q 740 170 750 170 L 960 170 Q 970 170 970 198 Z" fill="#a15a2f"/>
  <text x="855.0" y="189" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Video Combine (Segment Recombine)</text>
</g>
<text x="754" y="220" fill="#9a9a9a" font-size="11">splices the regenerated segment</text>
<text x="754" y="238" fill="#9a9a9a" font-size="11">back into the original video</text>

