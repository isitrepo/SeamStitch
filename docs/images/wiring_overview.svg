  <path d="M 380 88 Q 380 60 390 60 L 630 60 Q 640 60 640 88 Z" fill="#2f6fa5"/>
  <text x="510.0" y="79" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Load Video UI (First/Last Frame)</text>
</g>
