<text x="394" y="128" fill="#9a9a9a" font-size="11">first_frame, last_frame → your</text>
<text x="394" y="144" fill="#9a9a9a" font-size="11">regeneration pipeline (FLF, etc.)</text>

<g id="gen">
  <rect x="400" y="300" width="260" height="90" rx="10" fill="#2a2a2a" stroke="#4c4c4c" stroke-width="1.5"/>
