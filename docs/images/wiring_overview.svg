<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1000" height="440" fill="#1a1a1a"/>
<text x="20" y="28" fill="#e8e8e8" font-size="15" font-weight="600">SeamStitch — recommended wiring</text>

<g id="combine">
